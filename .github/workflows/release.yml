# Publishes a release when a version tag is pushed, built from the upstream
# version pinned in native/versions.env. The tag has to match that pin: v1.0.10,
# v1.0.10.1 for a Java-only fix, or v1.0.10-rc1 for a pre-release.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          source native/versions.env
          case "$GITHUB_REF_NAME" in
            "$AIRSPY_REF" | "$AIRSPY_REF".[0-9]* | "$AIRSPY_REF"-*) ;;
            *)
              echo "::error::Tag $GITHUB_REF_NAME does not match pinned upstream $AIRSPY_REF"
              exit 1
              ;;
          esac
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jars
          path: jars

      # Publishing is split into steps that can all be repeated, so a failed
      # upload or a re-run finishes the draft left behind rather than failing on
      # it: gh retries uploads, and a retry of an upload that had in fact
      # succeeded fails with "ReleaseAsset.name already exists" unless clobbering.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd jars && sha256sum *.jar > SHA256SUMS)
          main_jar="$(ls jars/jairspy-*.jar | grep -Ev -- '-(sources|javadoc)\.jar$')"
          info="$(unzip -p "$main_jar" jairspy/native/linux-x86_64/build-info.properties)"
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "::error::Release $GITHUB_REF_NAME is already published"
            exit 1
          elif gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Reusing the draft release $GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" --draft "${prerelease[@]}" \
              --verify-tag --generate-notes --title "jAirspy ${GITHUB_REF_NAME#v}" \
              --notes "Native library versions:

          \`\`\`
          $info
          \`\`\`"
          fi
          gh release upload "$GITHUB_REF_NAME" jars/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
